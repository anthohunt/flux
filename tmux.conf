# Flux — la console est un terminal attache, pas une capture.
# Ce fichier est applique a chaud au serveur tmux en place (`source-file`), donc
# il ne porte QUE des reglages globaux inoffensifs pour les autres sessions.
# L historique du pane est TOUT ce qu on peut remonter : l agent tourne en rendu
# classique, son fil entier y passe. 2000 lignes ne tiennent pas une run.
set -g history-limit 50000
set -g mouse on
# La taille de la fenetre est celle POSEE a la creation, pas celle du client.
# Deux lecteurs de largeurs differentes — un ecran large et un telephone — la
# feraient sinon changer, et tmux re-enroule alors le texte : l historique se
# retrouve melange. « latest » suit le dernier lecteur actif : un seul a la fois,
# donc pas de melange, et aucune zone de remplissage a cote du pane.
setw -g window-size latest
setw -g aggressive-resize off
# La molette, traduite. Quand l'application occupe l'ecran alterne, c'est ELLE
# qui detient le defilement, et elle ne l'ouvre qu'au clavier : on envoie donc
# PageUp / PageDown. Sinon — un shell, une run terminee — l'historique est du
# cote de tmux, et le copy-mode fait le travail.
bind -n WheelUpPane \
  if -F '#{alternate_on}' 'send-keys PageUp' \
    "if -F '#{pane_in_mode}' 'send -X scroll-up' 'copy-mode -e'"
bind -n WheelDownPane \
  if -F '#{alternate_on}' 'send-keys PageDown' \
    "if -F '#{pane_in_mode}' 'send -X scroll-down' ''"

set -g set-clipboard on
