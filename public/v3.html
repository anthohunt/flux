<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>flux</title>
<style>
:root{--bg:#0f1114;--card:#171a1f;--card2:#1e2229;--line:#2a2f37;--ink:#e8eaed;--ink2:#aab0b8;--ink3:#8b929c;--run:#4da3ff;--ok:#3fb27f;--warn:#e0a83a;--bad:#e05a4e;--ref:#e26bd3;--mono:ui-monospace,Consolas,"Cascadia Mono",monospace}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
a{color:var(--run)} table a{text-decoration:none} table a:hover{text-decoration:underline} :focus-visible{outline:2px solid var(--run);outline-offset:2px}
.skip{position:absolute;left:-999px;top:8px;background:var(--run);color:#fff;padding:8px 12px;border-radius:6px;z-index:9} .skip:focus{left:8px}
.top{display:flex;align-items:center;gap:14px;padding:12px 24px;border-bottom:1px solid var(--line)} .top .logo{font:600 .8rem var(--mono);letter-spacing:.2em;color:var(--ink3)} .top nav a{text-decoration:none} .top nav .sep{color:var(--ink3);margin:0 8px} .top .droite{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:.85rem;color:var(--ink3)} .top .droite a{color:var(--ink2);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px}
main{max-width:1180px;margin:0 auto;padding:22px 24px 60px}
h1{font-size:1.5rem;margin:0 0 4px} .sous{color:var(--ink2);margin:0 0 20px;font-size:.95rem}
.carte{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:18px}
h2{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 0 10px} h2 span{color:var(--ink2);text-transform:none;letter-spacing:0;font-weight:400}
.bilan{display:flex;gap:28px;align-items:baseline;margin:0 0 6px;flex-wrap:wrap} .bilan .v{font:600 1.7rem var(--mono)} .bilan .v small{font-size:.9rem;color:var(--ink3);font-weight:400} .bilan .k{font-size:.8rem;color:var(--ink3)}
svg{width:100%;height:auto;display:block}
.tick{fill:var(--ink3);font:11px var(--mono)} .lbl{fill:var(--ink3);font:11px var(--mono)} .ax{stroke:var(--line)} .grid{stroke:var(--line);stroke-dasharray:2 4}
.refl{stroke:var(--ref);stroke-dasharray:6 4;stroke-width:1.4} .ref-l{fill:var(--ref);font:600 11px var(--mono)}
.vit{fill:#3fb27f;opacity:.26} .pt{stroke-width:2} .lien{fill:none;stroke:#6bd3d3;stroke-width:1.6;opacity:.55} .val{font:600 11px var(--mono)}
.leg{display:flex;gap:18px;flex-wrap:wrap;font:.82rem var(--mono);color:var(--ink2);margin-top:6px} .leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:.92rem} th{text-align:left;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600} td{padding:9px 10px;border-bottom:1px solid var(--line)} tbody tr:last-child td{border-bottom:0}
td.n{font:600 .95rem var(--mono);color:var(--ink3);width:40px} td.note{font:600 1.05rem var(--mono);white-space:nowrap} td.dim{color:var(--ink3)} td.mono{font:.9rem var(--mono)} td.g{font:600 1.05rem var(--mono)}
.bar{display:inline-block;width:70px;height:7px;background:var(--line);border-radius:4px;vertical-align:middle;margin-left:8px;overflow:hidden} .bar i{display:block;height:100%;background:var(--ok)} .bar.moyen i{background:var(--warn)} .bar.bas i{background:var(--bad)}
tr.run{cursor:pointer} tr.run:hover td,tr.run:focus-within td{background:var(--card2)} tr.ouverte td{background:var(--card2)} .chev{color:var(--ink3);width:20px} tr.run button{all:unset;cursor:pointer;color:inherit;display:block;width:100%}
tr.ref td{color:var(--ref)} tr.ref td.dim{color:var(--ink3)}
.detail{padding:14px 10px 18px 44px;background:var(--card2)}
.resume{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px} .resume .b{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px} .resume h4{margin:0 0 6px;font-size:.85rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em} .resume ul{margin:0;padding-left:18px;font-size:.9rem;color:var(--ink2)} .resume li b{color:var(--ink)}
.mails{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px} .mail{all:unset;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer;text-align:center;display:block} .mail b{font:600 1.1rem var(--mono);display:block} .mail .id{font:.75rem var(--mono);color:var(--ink3)} .mail.bas b{color:var(--bad)} .mail.moyen b{color:var(--warn)} .mail.haut b{color:var(--ok)} .mail.panne b{color:var(--bad);font-size:.8rem} .mail.on{border-color:var(--run);box-shadow:0 0 0 1px var(--run)} .mail:hover{border-color:var(--ink3)}
.fiche{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px} .fiche h4{margin:0 0 6px;font-size:.95rem;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap} .fiche h4 .sc{font:600 1.1rem var(--mono)}
ul.f{margin:0;padding-left:18px;color:var(--ink2);font-size:.9rem} ul.f b{color:var(--ink)} ul.f li{margin:3px 0} .malus{color:var(--bad)} ul.f ul{padding-left:16px;margin:2px 0}
details{margin-top:8px} summary{cursor:pointer;color:var(--ink3);font-size:.85rem} pre{margin:6px 0 0;font:.82rem/1.45 var(--mono);color:var(--ink2);white-space:pre-wrap;max-height:360px;overflow:auto;background:var(--bg);padding:10px;border-radius:6px}
.msg{margin-top:8px;padding:8px 12px;border-left:3px solid var(--run);background:var(--bg);border-radius:0 6px 6px 0} .msg.de{border-left-color:var(--ok)} .msg .qui{font:600 .82rem var(--mono);color:var(--ink2);display:flex;gap:10px} .msg .qui span{margin-left:auto;color:var(--ink3);font-weight:400}
.note-bas{color:var(--ink3);font-size:.85rem} .vide{color:var(--ink3);padding:20px 0}
details.jeu>summary{font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:0 0 10px} details.jeu>summary span{color:var(--ink2);text-transform:none;letter-spacing:0;font-weight:400;margin-left:8px}
.pill{display:inline-block;font:.75rem var(--mono);padding:1px 7px;border-radius:10px;background:var(--card2);color:var(--ink3);margin-left:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:760px){.resume{grid-template-columns:1fr}}
</style></head><body>
<a class="skip" href="#main">Aller au contenu</a>
<div class="top"><span class="logo">FLUX</span><nav id="fil" aria-label="Fil d’Ariane"><a href="#/">Workflows</a></nav><span class="droite"><a href="/v2">console v2</a><a href="/ancienne?wf=agenda">ancienne console</a></span></div>
<main id="main"><div id="ecran"></div></main>
<script>
const $=s=>document.querySelector(s); const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
async function api(u){const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(u+' → '+r.status);return r.json();}
const LOTS={defi:'évaluation',boucle:'entraînement',sentinelle:'sentinelle'};
const CASE={action_type:'type d’événement',date_debut:'date',heure_debut:'heure',fin:'heure de fin',lieu:'lieu',lien:'lien',reference:'référence',montant_euros:'montant',documents:'documents'};
const TYP={rendez_vous:'rendez-vous',echeance:'échéance',periode:'période'}; const ACT={creer:'',annuler:'annuler '};
const PAL=['#6bd3d3','#f6a35b','#8ed36b','#5b9cf6','#f6e05b','#c98bff','#ff7f7f','#6bd3a0'];
const modTxt=m=>String(m||'').replace(/^(llamacpp|ollama):/,''); const moteur=m=>String(m||'').startsWith('llamacpp:')?'llama.cpp':String(m||'').startsWith('ollama:')?'ollama':'';
const vitesse=s=>s?60/s:0; const fmt1=x=>(Math.round(x*10)/10).toLocaleString('fr-FR'); const quand=t=>String(t||'').slice(5,16).replace('T',' ').replace(/^(\d\d)-(\d\d)/,'$2/$1');
const clsNote=(s,b)=>s==null?'panne':s/(b||72)>=.9?'haut':s/(b||72)>=.6?'moyen':'bas';
function fil(parts){$('#fil').innerHTML=parts.map((p,i)=>i<parts.length-1?`<a href="${p[1]}">${esc(p[0])}</a><span class="sep">›</span>`:`<b>${esc(p[0])}</b>`).join('');}
function lisible(f){ return f.split(' ; ').map(x=>{const m=x.trim().match(/^(\w+) (\w+) \((.*?) -> (.*?)\)( -1)?$/); if(!m) return esc(x); const [,c,v,a,o,mal]=m; const C=CASE[c]||c, val=s=>{s=s.trim().replace(/^'|'$/g,'').trim();return s===''?'<i>vide</i>':esc(s)}; let t; if(v==='INVENTE') t=`<b>${C}</b> inventé : ${val(o)} alors que le mail n’en donne pas`; else if(v==='OUBLI') t=`<b>${C}</b> oublié : il fallait ${val(a)}`; else t=`<b>${C}</b> ${v==='FAUX'?'faux':v==='PARTIEL'?'incomplet':v.toLowerCase()} : ${val(o)} au lieu de ${val(a)}`; if(mal) t+=' <span class="malus">(−1)</span>'; return t;}).join(' · '); }
function etiq(t){const m=String(t).trim().match(/^(creer|annuler) (rendez_vous|echeance|periode) (\d{4})-(\d{2})-(\d{2}) (.*)$/); if(!m) return esc(t); const [,a,ty,y,mo,d,titre]=m; return `${ACT[a]}${TYP[ty]} du ${+d}/${+mo} — ${esc(titre)}`;}
// Une ligne du juge → {e, pts, sur, malus, attendu, obtenu, fautes, genre: ok|invente|oubli|cases}
function ligneJuge(l){ const m=l.match(/^\[(E\d|E\+)\] (\d+)\/(\d+)( -\d+)? \| attendu : (.*?) \| obtenu : (.*?) \| (.*)$/); if(!m){ const n=l.match(/^\[(E\+)\] (-\d+) \| attendu : (.*?) \| obtenu : (.*?) \| (.*)$/); if(n) return {e:n[1],pts:0,sur:0,malus:n[2],attendu:n[3],obtenu:n[4],fautes:n[5],genre:'invente'}; return null; } const [,e,pts,sur,mal,att,obt,f]=m; const ok=/toutes cases OK|^OK$/.test(f); const genre=ok?'ok':/^INVENTE$|EN-TROP/.test(f.trim())?'invente':/^OUBLI$/.test(f.trim())?'oubli':'cases'; return {e,pts:+pts,sur:+sur,malus:mal?mal.trim():'',attendu:att,obtenu:obt,fautes:f,genre}; }
// Le resume d'une run : ce qui a coute des points, agrege sur ses mails
function resumeRun(mails){ const inv=[],oub=[],cases={}; let nCases=0; for(const m of mails){ for(const l of (m.lignes||[])){ const j=ligneJuge(l); if(!j) continue; if(j.genre==='invente') inv.push(m.cas); else if(j.genre==='oubli') oub.push(m.cas); else if(j.genre==='cases'){ for(const x of j.fautes.split(' ; ')){ const mm=x.trim().match(/^(\w+) (\w+) \(/); if(mm){ const c=CASE[mm[1]]||mm[1]; cases[c]=(cases[c]||0)+1; nCases++; } } } } } const uniq=a=>[...new Set(a)]; const li=[]; const mailsL=a=>uniq(a).map(x=>x.replace(/^(mail|defi)-/,'')).join(', '); if(inv.length) li.push(`<li><b>${inv.length} événement${inv.length>1?'s':''} inventé${inv.length>1?'s':''}</b> (0/18 et −1 chacun) — mails ${mailsL(inv)}</li>`); if(oub.length) li.push(`<li><b>${oub.length} événement${oub.length>1?'s':''} oublié${oub.length>1?'s':''}</b> (0/18 chacun) — mails ${mailsL(oub)}</li>`); if(nCases) li.push(`<li><b>${nCases} case${nCases>1?'s':''} fausse${nCases>1?'s':''}</b> — ${Object.entries(cases).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k} (${v})`).join(', ')}</li>`); const pannes=mails.filter(m=>m.score==null); if(pannes.length) li.push(`<li><b>${pannes.length} panne${pannes.length>1?'s':''}</b> — mails ${mailsL(pannes.map(m=>m.cas))}</li>`); return li.length?li.join(''):'<li>rien : toutes les cases sont justes</li>'; }

async function accueil(){ fil([['Workflows','#/']]); $('#ecran').innerHTML='<h1>Workflows</h1><p class="note-bas">chargement…</p>'; const fams=await api('/api/familles');
  const rows=fams.map(f=>{ const d=f.derniere; const note=d&&d.note!=null?`<span style="color:var(--${clsNote(d.note,d.bareme)==='haut'?'ok':clsNote(d.note,d.bareme)==='moyen'?'warn':'bad'})">${d.note} /${d.bareme||72}</span>`:'<span style="color:var(--ink3);font-weight:400;font-size:.9rem">jamais joué</span>'; return `<tr class="${f.runs?'':'dim'}"><td><a href="#/f/${esc(f.base)}"><b>${esc(f.name)}</b></a></td><td class="g">${note}</td><td class="dim">${f.cible||'—'}</td><td class="dim">${d?`${quand(d.debut)} · ${esc(modTxt(d.modele))} · ${esc(d.version)} · ${esc(LOTS[d.lot]||d.lot)}`:''}</td><td class="dim">${f.runs}</td><td class="dim">${f.nodes}</td></tr>`; }).join('');
  $('#ecran').innerHTML=`<h1>Workflows</h1><p class="sous">Un workflow = une suite d’étapes jouée par une IA et notée sur des jeux de mails. Une ligne par workflow, toutes versions de consignes confondues.</p><div class="carte"><table><thead><tr><th scope="col">Workflow</th><th scope="col">Dernière note</th><th scope="col">Cible</th><th scope="col">Dernière run</th><th scope="col">Runs</th><th scope="col">Étapes</th></tr></thead><tbody>${rows}</tbody></table></div>`; }

let FAM=null;
async function famille(base,ouvrir,casOuvert){ FAM=await api('/api/famille/'+base); const d=FAM; fil([['Workflows','#/'],[d.name,'#/f/'+base]]);
  const ref=b=>{ const rs=d.runs.filter(r=>r.lot===b&&r.fin&&r.note!=null); const pleins=rs.filter(r=>!r.attendus||r.n>=r.attendus); return (pleins.length?pleins:rs).slice().sort((a,b)=>b.note-a.note)[0]||null; };
  const refB=ref('boucle'); const nb=l=>d.cas.filter(c=>c.lot===l).length;
  $('#ecran').innerHTML=`<h1>${esc(d.name)}</h1><p class="sous">${esc(d.description)}</p>
    <div id="jeu-boucle"></div>
    <details class="jeu" id="jeu-defi-d"><summary>Évaluation <span>· ${nb('defi')} mails jamais vus pendant le réglage — à ouvrir quand on y vient</span></summary><div id="jeu-defi"></div></details>`;
  jeu('boucle',$('#jeu-boucle'),ouvrir,casOuvert); $('#jeu-defi-d').addEventListener('toggle',ev=>{ if(ev.target.open&&!$('#jeu-defi').innerHTML) jeu('defi',$('#jeu-defi')); }); if(ouvrir&&d.runs.some(r=>r.nom===ouvrir&&r.lot==='defi')){ $('#jeu-defi-d').open=true; } }

function jeu(lot,el,ouvrir,casOuvert){ const d=FAM; const nbCas=d.cas.filter(c=>c.lot===lot).length; const runs=d.runs.filter(r=>r.lot===lot&&r.fin&&r.note!=null).slice().sort((a,b)=>String(a.debut).localeCompare(String(b.debut)));
  if(!runs.length){ el.innerHTML=`<div class="carte"><h2>${LOTS[lot]} <span>· ${nbCas} mails</span></h2><p class="vide">aucune run sur ce jeu.</p></div>`; return; }
  const pleins=runs.filter(r=>!r.attendus||r.n>=r.attendus); const ref=(pleins.length?pleins:runs).slice().sort((a,b)=>b.note-a.note)[0];
  const serie=runs.filter(r=>r!==ref); serie.forEach((r,i)=>r.i=i+1); const der=serie[serie.length-1]||ref;
  const modeles=[...new Set(runs.map(r=>r.modele))].filter(m=>m!==ref.modele||serie.some(r=>r.modele===m)); const coul=m=>m===ref.modele&&!serie.some(r=>r.modele===m)?'var(--ref)':PAL[modeles.indexOf(m)%PAL.length];
  const bareme=ref.bareme||72;
  // bilan
  const bilan=`<div class="bilan"><div><div class="v">${der.note}<small> /${bareme}</small></div><div class="k">dernière run · ${esc(modTxt(der.modele))} · consignes ${esc(der.version)}</div></div><div><div class="v">${fmt1(vitesse(der.s_par_mail))}<small> mails/min</small></div><div class="k">vitesse (${fmt1(der.s_par_mail)} s par mail)</div></div><div><div class="v" style="color:var(--ref)">${ref.note}<small> /${bareme}</small></div><div class="k">référence ${esc(modTxt(ref.modele))} · ${esc(ref.version)} · ${fmt1(vitesse(ref.s_par_mail))} mails/min${d.cible?` · cible ${d.cible}`:''}</div></div></div>`;
  // graphique
  const W=1100,L=60,R=60,T=34,H0=250,B=36,Hh=T+H0+B,iw=W-L-R,N=serie.length; const X=i=>L+30+(N<=1?(iw-60)/2:(i-1)*(iw-60)/(N-1)); const Y=n=>T+H0-(n/bareme)*H0;
  const vmax=Math.max(1,Math.ceil(Math.max(...runs.map(r=>vitesse(r.s_par_mail)))*1.15)); const YV=v=>T+H0-(v/vmax)*H0;
  let g='';
  for(const n of [0,Math.round(bareme/2),bareme]) g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(n)}" y2="${Y(n)}"/><text class="tick" x="${L-8}" y="${Y(n)+4}" text-anchor="end">${n}</text>`;
  for(const v of [Math.round(vmax/2*10)/10,vmax]) g+=`<text class="tick" x="${W-R+8}" y="${YV(v)+4}">${fmt1(v)}</text>`; g+=`<text class="tick" x="${W-R+8}" y="${YV(0)+4}">0</text>`;
  g+=`<text class="lbl" x="${L-8}" y="${T-14}">note /${bareme}</text><text class="lbl" x="${W-R+8}" y="${T-14}" text-anchor="end">mails / min</text>`;
  g+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  for(const r of serie) g+=`<rect class="vit" x="${X(r.i)-12}" y="${YV(vitesse(r.s_par_mail))}" width="24" height="${(YV(0)-YV(vitesse(r.s_par_mail))).toFixed(1)}"><title>run ${r.i} · ${fmt1(vitesse(r.s_par_mail))} mails/min</title></rect>`;
  g+=`<line class="refl" x1="${L}" x2="${W-R}" y1="${Y(ref.note)}" y2="${Y(ref.note)}"/><text class="ref-l" x="${W-R-4}" y="${Y(ref.note)-6}" text-anchor="end">${esc(modTxt(ref.modele))} · ${ref.note}</text>`;
  if(d.cible&&Math.abs(d.cible-ref.note)>2) g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(d.cible)}" y2="${Y(d.cible)}" style="stroke:var(--ok)"/><text class="lbl" x="${L+4}" y="${Y(d.cible)+13}" style="fill:var(--ok)">cible ${d.cible}</text>`;
  if(serie.length>1) g+=`<polyline class="lien" points="${serie.map(r=>X(r.i)+','+Y(r.note)).join(' ')}"/>`;
  for(const r of serie) g+=`<circle class="pt" cx="${X(r.i)}" cy="${Y(r.note)}" r="${r===der?7:5}" fill="${coul(r.modele)}" stroke="${coul(r.modele)}"><title>run ${r.i} · ${esc(r.nom)}\n${esc(modTxt(r.modele))} · consignes ${esc(r.version)}\nnote ${r.note}/${bareme} · ${fmt1(vitesse(r.s_par_mail))} mails/min · ${r.n} mails${r.pannes?' · '+r.pannes+' panne(s)':''}</title></circle>${r===der?`<text class="val" x="${X(r.i)}" y="${Y(r.note)-12}" text-anchor="middle" fill="${coul(r.modele)}">${r.note}</text>`:''}`;
  for(const r of serie) g+=`<text class="tick" x="${X(r.i)}" y="${Y(0)+18}" text-anchor="middle">${r.i} · ${esc(r.version)}</text>`;
  const leg=modeles.map(m=>`<span style="color:${coul(m)}"><i style="background:${coul(m)}"></i>${esc(modTxt(m))}</span>`).join('')+`<span><i style="background:#3fb27f;opacity:.5;border-radius:2px"></i>vitesse, mails par minute (plus haut = plus rapide)</span><span style="color:var(--ref)"><i style="background:var(--ref)"></i>référence : ${esc(modTxt(ref.modele))}</span>`;
  // liste
  const ligne=(r,num)=>{ const cls=clsNote(r.note,bareme); const partiel=r.attendus&&r.n<r.attendus; return `<tr class="run ${num==null?'ref':''}" data-nom="${esc(r.nom)}" data-wf="${esc(r.wf)}" data-modele="${esc(r.modele)}"><td class="chev" aria-hidden="true">▸</td><td class="n">${num==null?'réf.':num}</td><td class="dim">${quand(r.debut)}</td><td class="mono">${esc(r.version)}</td><td class="mono">${esc(modTxt(r.modele))}${moteur(r.modele)?`<span class="pill">${moteur(r.modele)}</span>`:''}</td><td class="note">${r.note}<span class="bar ${cls}" aria-hidden="true"><i style="width:${Math.round(r.note/bareme*100)}%;${num==null?'background:var(--ref)':''}"></i></span></td><td>${fmt1(vitesse(r.s_par_mail))} mails/min</td><td class="dim">${partiel?`<b style="color:var(--warn)">${r.n} sur ${r.attendus}</b>`:r.n} mail${r.n>1?'s':''}${r.pannes?' · '+r.pannes+' panne'+(r.pannes>1?'s':''):''}</td></tr><tr class="det" hidden><td colspan="8" style="padding:0"></td></tr>`; };
  const rows=serie.slice().reverse().map(r=>ligne(r,r.i)).join('')+ligne(ref,null);
  el.innerHTML=`<div class="carte"><h2>${LOTS[lot]} <span>· ${nbCas} mails · ${runs.length} run${runs.length>1?'s':''}</span></h2>${bilan}<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Runs de gauche à droite : note (points) et vitesse en mails par minute (barres) ; la ligne est la référence"><title>Progression des runs sur le jeu ${LOTS[lot]}</title>${g}</svg><div class="leg">${leg}</div></div>
    <div class="carte"><h2>Runs <span>· la plus récente en haut · la référence en bas · cliquer pour dérouler</span></h2><table><thead><tr><th scope="col"><span class="sr">dérouler</span></th><th scope="col">#</th><th scope="col">Quand</th><th scope="col">Consignes</th><th scope="col">Modèle</th><th scope="col">Note /${bareme}</th><th scope="col">Vitesse</th><th scope="col">Mails</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  el.querySelectorAll('tr.run').forEach(tr=>{ tr.tabIndex=0; tr.setAttribute('role','button'); tr.setAttribute('aria-expanded','false'); const f=()=>derouler(tr,lot,bareme); tr.onclick=f; tr.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();f();} }; });
  if(ouvrir){ const tr=el.querySelector(`tr.run[data-nom="${CSS.escape(ouvrir)}"]`); if(tr){ derouler(tr,lot,bareme,casOuvert); } }
}

async function derouler(tr,lot,bareme,casOuvert){ const det=tr.nextElementSibling; const cell=det.firstElementChild; const ouvert=!det.hidden; document.querySelectorAll('tr.det').forEach(x=>{x.hidden=true;}); document.querySelectorAll('tr.run').forEach(x=>{x.classList.remove('ouverte');x.setAttribute('aria-expanded','false');x.firstElementChild.textContent='▸';});
  if(ouvert) return; det.hidden=false; tr.classList.add('ouverte'); tr.setAttribute('aria-expanded','true'); tr.firstElementChild.textContent='▾';
  const nom=tr.dataset.nom, wf=tr.dataset.wf, modele=tr.dataset.modele; cell.innerHTML='<div class="detail"><p class="note-bas">chargement…</p></div>';
  let r; try{ r=await api(`/api/wf/${wf}/run-detail?nom=${encodeURIComponent(nom)}`);}catch(e){ cell.innerHTML=`<div class="detail"><p class="note-bas">erreur : ${esc(e.message)}</p></div>`; return; }
  const run=FAM.runs.find(x=>x.nom===nom&&x.modele===modele)||{}; const mails=r.mails.filter(m=>m.modele===modele); const b=r.bilan[modele]||{};
  const theme=c=>(FAM.cas.find(x=>x.id===c)||{}).theme||'';
  const cases=mails.map(m=>`<button class="mail ${clsNote(m.score,bareme)}" data-run="${esc(m.run)}" data-cas="${esc(m.cas)}" title="${esc(m.cas)} — ${esc(theme(m.cas))}"><span class="id">${esc(m.cas.replace(/^(mail|defi)-/,''))}</span><b>${m.score==null?'panne':m.score}</b></button>`).join('');
  cell.innerHTML=`<div class="detail"><div class="resume"><div class="b"><h4>Ce qui a coûté des points (${mails.length} mails)</h4><ul>${resumeRun(mails)}</ul></div><div class="b"><h4>La run</h4><ul><li>modèle <b>${esc(modTxt(modele))}</b>${moteur(modele)?' · '+moteur(modele):''}</li><li>consignes <b>${esc(run.version||'')}</b>${(r.noeuds||[]).length>1?' · '+r.noeuds.length+' étapes ('+r.noeuds.join(' → ')+')':''} · empreinte ${esc(r.consignes_md5)}</li><li>${b.n||mails.length} mails · ${b.pannes||0} panne${(b.pannes||0)>1?'s':''} · ${fmt1(b.s_par_mail||0)} s par mail · ${Math.round((b.jetons_entree||0)/1000)} k jetons par mail</li><li class="dim">${esc(LOTS[r.lot]||r.lot)} · ${esc(r.nom)} · ${quand(r.debut)} → ${quand(r.fin)}</li></ul></div></div><div class="mails" style="grid-template-columns:repeat(${Math.min(16,Math.max(1,mails.length))},1fr)">${cases}</div><div class="fiche-box"></div></div>`;
  cell.querySelectorAll('.mail').forEach(bt=>bt.onclick=()=>fiche(cell,bt,wf,r.noeud,bareme));
  if(casOuvert){ const bt=cell.querySelector(`.mail[data-cas="${CSS.escape(casOuvert)}"]`); if(bt) fiche(cell,bt,wf,r.noeud,bareme); }
  location.hash=`#/f/${FAM.base}/run/${encodeURIComponent(nom)}`; }

async function fiche(cell,bt,wf,noeud,bareme){ cell.querySelectorAll('.mail').forEach(x=>x.classList.remove('on')); bt.classList.add('on'); const box=cell.querySelector('.fiche-box'); box.innerHTML='<div class="fiche"><p class="note-bas">chargement…</p></div>';
  let p; try{ p=await api(`/api/wf/${wf}/passe-fichiers?run=${encodeURIComponent(bt.dataset.run)}&noeud=${encodeURIComponent(noeud)}`);}catch(e){ box.innerHTML=`<div class="fiche"><p class="note-bas">erreur : ${esc(e.message)}</p></div>`; return; }
  const note=p.passe.note||{}; const cas=bt.dataset.cas; const th=(FAM.cas.find(x=>x.id===cas)||{}); const s=note.score;
  const li=(note.lignes||[]).map(ligneJuge).filter(Boolean).map(j=>{ if(j.genre==='ok') return `<li><b>${j.attendu?etiq(j.attendu):'rien'}</b> ${j.pts}/${j.sur} — juste</li>`; if(j.genre==='invente') return `<li><b>en trop</b> 0/${j.sur||18} : ${j.obtenu?etiq(j.obtenu):''} alors que le mail n’appelle rien ici <span class="malus">(−1)</span></li>`; if(j.genre==='oubli') return `<li><b>oublié</b> 0/${j.sur} : il fallait ${etiq(j.attendu)}</li>`; return `<li><b>${etiq(j.attendu)}</b> ${j.pts}/${j.sur}${j.malus?' <span class="malus">'+j.malus+'</span>':''}<ul><li>rendu : ${etiq(j.obtenu)}</li><li>${lisible(j.fautes)}</li></ul></li>`; }).join('');
  const plancher=(note.lignes||[]).find(l=>l.startsWith('plancher')); const pm=plancher&&plancher.match(/plancher (\d+)/);
  const f=p.fichiers||{}; const reps=Object.keys(f).filter(k=>/^reponse-/.test(k));
  box.innerHTML=`<div class="fiche"><h4>${esc(cas)} — ${esc(th.theme||'')} <span class="sc" style="color:var(--${clsNote(s,bareme)==='haut'?'ok':clsNote(s,bareme)==='moyen'?'warn':'bad'})">${s==null?'panne':s+' /'+bareme}</span>${th.difficulte?`<span class="pill">${esc(th.difficulte)}</span>`:''}</h4>
    <details><summary>le mail${p.entree&&p.entree.contenu?` (${(p.entree.contenu.length/1000).toFixed(1)} k caractères)`:''}</summary><pre>${esc((p.entree||{}).contenu||'')}</pre></details>
    ${li?`<ul class="f">${li}</ul>`:'<p class="note-bas">pas de note (panne : '+esc((p.passe.panne||{}).constat||(p.passe.panne||{}).cause||'?')+')</p>'}${pm?`<p class="note-bas">une réponse vide aurait eu ${pm[1]} : c’est le plancher de ce mail.</p>`:''}
    <details><summary>transcript — ce qu’on a envoyé, ce qui a été rendu</summary><div class="msg vers"><div class="qui">flux → ${esc(modTxt(bt.closest('tr')?'':''))}modèle <span>prompt.md · ${((f['prompt.md']||'').length/1000).toFixed(1)} k car.</span></div><pre>${esc(f['prompt.md']||'')}</pre></div>${reps.map(k=>`<div class="msg de"><div class="qui">modèle → flux <span>${esc(k)} · ${((f[k]||'').length/1000).toFixed(1)} k car.</span></div><pre>${esc(f[k]||'')}</pre></div>`).join('')||'<p class="note-bas">aucune réponse enregistrée.</p>'}</details></div>`;
  box.scrollIntoView({block:'nearest'}); }

async function router(){ const h=location.hash||'#/'; let m; try{ if((m=h.match(/^#\/f\/([\w-]+)(?:\/run\/([^/]+))?(?:\/cas\/([\w.-]+))?$/))){ if(FAM&&FAM.base===m[1]&&m[2]&&document.querySelector('tr.run.ouverte')) return; await famille(m[1],m[2]?decodeURIComponent(m[2]):null,m[3]||null); } else await accueil(); }catch(e){ $('#ecran').innerHTML='<p class="vide">'+esc(e.message)+'</p>'; } }
window.addEventListener('hashchange',router); router();
</script></body></html>
